<app-header></app-header>
<section class="w-full flex justify-center mt-10">
    <div class="input-group">
        <label>Selecionar destinatário: </label>

        <select [ngModel]="selectedRecipient()" (ngModelChange)="selectedRecipient.set($event)" name="recipient"
            [disabled]="isLoading() || isActive">
            <option [ngValue]="null">Selecione um cliente</option>

            @for (recipient of recipients(); track recipient.conta.numero) {
            <option [ngValue]="recipient" class="bg-black">
                {{ recipient.cliente.nome }} - Conta {{ recipient.conta.numero }}
            </option>
            }
        </select>
    </div>
</section>

<section class="flex items-center justify-center mt-10">
    <div class="w-full max-w-md">
        <div class="text-center mb-12">
            <h2 class="text-[10px] tracking-[0.2em] text-gray-400 font-bold uppercase mb-4">
                VALOR DO TRANSFERÊNCIA
            </h2>
            <p class="text-sm text-gray-400 mb-2">
                Saldo atual:
                <strong class="text-purple-400">
                    {{ (contaOrigem()?.saldo || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) }}
                </strong>
            </p>
            <div class="flex items-center justify-center">
                <span class="text-3xl font-bold text-purple-500 mr-2 mt-2">R$</span>
                <input type="text" [value]="amount" (input)="formatCurrency($event.target.value)"
                    [disabled]="isActive"
                    class="bg-transparent text-6xl font-medium outline-none text-center w-full max-w-[240px] focus:border-b-2 border-purple-500 transition-all pb-2" />
            </div>
        </div>

        <div class="anim-container" [class.active]="isActive">
            <div class="left-side">
                <div class="card">
                    <div class="card-line"></div>
                    <div class="buttons"></div>
                </div>
                <div class="post">
                    <div class="post-line"></div>
                    <div class="screen">
                        <div class="dollar">$</div>
                    </div>
                </div>
            </div>
            <div class="right-side" (click)="transferir()">
                <div class="new">Confirmar Transferência</div>
                <svg viewBox="0 0 451.846 451.847" class="arrow" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#ffffff"
                        d="M345.441 248.292L151.154 442.573c-12.359 12.365-32.397 12.365-44.75 0-12.354-12.354-12.354-32.391 0-44.744L278.318 225.92 106.409 54.017c-12.354-12.359-12.354-32.394 0-44.748 12.354-12.359 32.391-12.359 44.75 0l194.287 194.284c6.177 6.18 9.262 14.271 9.262 22.366 0 8.099-3.091 16.196-9.267 22.373z">
                    </path>
                </svg>
            </div>
        </div>

        <p class="text-center text-[10px] text-gray-600 uppercase tracking-widest mt-6">
            Transação Segura
        </p>

        @if (errorMessage()) {
        <p class="text-center text-sm text-red-400 mt-4">{{ errorMessage() }}</p>
        }

        @if (successMessage()) {
        <p class="text-center text-sm text-green-400 mt-4">{{ successMessage() }}</p>
        }
    </div>
</section>
