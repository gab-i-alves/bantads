<app-header></app-header>
<section class="flex items-center justify-center mt-10">
    <div class="w-full max-w-md surface-panel p-8">
        <h2 class="text-center text-[10px] tracking-[0.2em] text-gray-400 font-bold uppercase mb-2">
            Transferência
        </h2>
        <p class="text-center text-sm text-gray-400 mb-8">
            Saldo atual:
            <strong class="text-purple-400">
                {{ (contaOrigem()?.saldo || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) }}
            </strong>
        </p>

        <div class="mb-6">
            <label class="block text-[11px] text-gray-400 uppercase tracking-widest mb-2">Conta destino</label>
            <input type="text" [(ngModel)]="destino" name="destino" [disabled]="isActive"
                placeholder="Número da conta (ex: 0950)"
                class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500 transition-colors" />
        </div>

        <div class="mb-8">
            <label class="block text-[11px] text-gray-400 uppercase tracking-widest mb-2">Valor</label>
            <div class="flex items-center bg-[#1a1a1a] border border-gray-700 rounded-lg px-4 py-3 focus-within:border-purple-500 transition-colors">
                <span class="text-xl font-bold text-purple-500 mr-2">R$</span>
                <input type="text" [value]="amount" (input)="formatCurrency($event.target.value)" [disabled]="isActive"
                    class="bg-transparent text-2xl font-medium outline-none w-full" />
            </div>
        </div>

        <div class="anim-container" (click)="transferir()" [class.active]="isActive">
            <div class="left-side">
                <div class="card">
                    <div class="card-line"></div>
                    <div class="buttons"></div>
                </div>
                <div class="post">
                    <div class="post-line"></div>
                    <div class="screen">
                        <div class="dollar">$</div>
                    </div>
                </div>
            </div>
            <div class="right-side">
                <div class="new">Confirmar Transferência</div>
                <svg viewBox="0 0 451.846 451.847" class="arrow" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#ffffff"
                        d="M345.441 248.292L151.154 442.573c-12.359 12.365-32.397 12.365-44.75 0-12.354-12.354-12.354-32.391 0-44.744L278.318 225.92 106.409 54.017c-12.354-12.359-12.354-32.394 0-44.748 12.354-12.359 32.391-12.359 44.75 0l194.287 194.284c6.177 6.18 9.262 14.271 9.262 22.366 0 8.099-3.091 16.196-9.267 22.373z">
                    </path>
                </svg>
            </div>
        </div>

        @if (errorMessage()) {
        <p class="text-center text-sm text-red-400 mt-4">{{ errorMessage() }}</p>
        }

        @if (successMessage()) {
        <p class="text-center text-sm text-green-400 mt-4">{{ successMessage() }}</p>
        }
    </div>
</section>
